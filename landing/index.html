<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizFlow — Step Through. Work Smarter.</title>
<meta name="description" content="바쁜 매장, 손이 부족한 가게. 매출·단골·할 일을 한 화면에 모아 컴퓨터가 대신 정리합니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23fff'/%3E%3Ctext x='50' y='70' font-size='54' font-family='Inter,Arial' font-weight='700' text-anchor='middle' fill='%23000'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; background: #000; color: #fff; -webkit-font-smoothing: antialiased; }

  /* ===== Background video ===== */
  .bg-video {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%; object-fit: cover;
  }

  /* ===== Bottom blur overlay (no dark gradient) ===== */
  .blur-overlay {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    -webkit-mask-image: linear-gradient(to top, black 0%, transparent 45%);
    mask-image: linear-gradient(to top, black 0%, transparent 45%);
  }

  /* ===== Liquid glass ===== */
  .liquid-glass {
    position: relative;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
  }
  .liquid-glass::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .liquid-glass:hover { background: rgba(255, 255, 255, 0.06); }

  /* ===== Blur fade up ===== */
  @keyframes blurFadeUp {
    from { opacity: 0; filter: blur(20px); transform: translateY(40px); }
    to   { opacity: 1; filter: blur(0); transform: translateY(0); }
  }
  .animate-blur-fade-up {
    opacity: 0;
    animation: blurFadeUp 1s ease-out forwards;
  }

  /* ===== Navbar ===== */
  .nav {
    position: relative; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1rem; padding: 1.25rem 1.5rem;
  }
  @media (min-width: 768px) { .nav { padding: 1.5rem 3rem; } }
  @media (min-width: 1024px) { .nav { padding: 1.5rem 3rem; } }

  .logo {
    height: 2rem; line-height: 2rem;
    font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em;
    display: flex; align-items: center; gap: 0.6rem;
  }
  .logo .mark { width: 2rem; height: 2rem; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; font-size: 1.05rem; font-weight: 700; }
  @media (min-width: 768px) { .logo { height: 2.5rem; line-height: 2.5rem; font-size: 1.75rem; } .logo .mark { width: 2.5rem; height: 2.5rem; font-size: 1.3rem; } }

  .nav-links { display: none; align-items: center; gap: 2rem; }
  @media (min-width: 1024px) { .nav-links { display: flex; } }
  .nav-links a { font-size: 0.875rem; color: rgba(255,255,255,0.85); transition: color 0.3s; }
  .nav-links a:hover { color: #d1d5db; }

  .nav-right { display: flex; align-items: center; gap: 0.75rem; }

  .btn-search {
    display: none; align-items: center; gap: 0.5rem;
    border-radius: 9999px; color: #fff;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    transition: background 0.3s;
  }
  @media (min-width: 640px) { .btn-search { display: inline-flex; } }
  @media (min-width: 768px) { .btn-search { padding: 0.5rem 1.5rem; } }

  .btn-user {
    display: none; align-items: center; justify-content: center;
    width: 2.5rem; height: 2.5rem; border-radius: 9999px; color: #fff;
    transition: background 0.3s;
  }
  @media (min-width: 640px) { .btn-user { display: grid; } }

  .btn-burger {
    display: grid; place-items: center;
    width: 2.5rem; height: 2.5rem; border-radius: 9999px; color: #fff;
  }
  @media (min-width: 1024px) { .btn-burger { display: none; } }
  .btn-burger svg { grid-area: 1 / 1; transition: transform 0.5s ease-out, opacity 0.5s ease-out; }
  .icon-menu { opacity: 1; }
  .icon-close { opacity: 0; transform: rotate(180deg) scale(0.5); }
  .btn-burger.open .icon-menu { opacity: 0; transform: rotate(-180deg) scale(0.5); }
  .btn-burger.open .icon-close { opacity: 1; transform: rotate(0) scale(1); }

  /* ===== Mobile menu ===== */
  .mobile-menu {
    position: absolute; top: 72px; left: 0; right: 0; z-index: 40;
    background: rgba(17,17,17,0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid #1f2937; border-bottom: 1px solid #1f2937;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.9);
    padding: 0.75rem;
    transition: transform 0.5s ease-out, opacity 0.5s ease-out;
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .mobile-menu.closed {
    transform: translateY(-1rem);
    opacity: 0; pointer-events: none;
  }
  @media (min-width: 1024px) { .mobile-menu { display: none; } }
  .mobile-menu a {
    display: block; padding: 0.75rem; border-radius: 0.5rem;
    font-size: 0.9rem; color: #fff;
    transition: background 0.3s;
  }
  .mobile-menu a:hover { background: rgba(31,41,55,0.5); }
  .slide-item { opacity: 0; }
  .mobile-menu.open .slide-item { animation: slideIn 0.5s ease-out forwards; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-1rem); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .mobile-menu .divider { border-top: 1px solid #1f2937; margin: 0.5rem 0; }
  .mobile-menu .m-search-row { display: flex; gap: 0.75rem; padding: 0.5rem 0 0.25rem; }
  @media (min-width: 640px) { .mobile-menu .m-search-row { display: none; } }
  .m-glass {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    border-radius: 9999px; color: #fff; padding: 0.6rem 1rem; font-size: 0.875rem;
  }
  .m-glass.circle { flex: 0 0 auto; width: 2.5rem; height: 2.5rem; }

  /* ===== Hero content ===== */
  .hero {
    position: relative;
    height: 100vh;
    display: flex; flex-direction: column;
  }
  .hero-body {
    position: relative; z-index: 10;
    flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 1rem 2rem;
  }
  @media (min-width: 640px) { .hero-body { padding: 0 1.5rem 2rem; } }
  @media (min-width: 768px) { .hero-body { padding: 0 3rem 4rem; } }

  .hero-inner { display: flex; flex-direction: column; align-items: flex-start; gap: 2rem; }
  @media (min-width: 768px) { .hero-inner { flex-direction: row; align-items: flex-end; } }

  .hero-left { flex: 1; min-width: 0; }

  .meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.5rem;
    margin-bottom: 1.5rem;
    font-size: 0.75rem;
  }
  @media (min-width: 640px) { .meta { font-size: 0.875rem; margin-bottom: 2rem; gap: 0.75rem 1.5rem; } }
  .meta-item { display: flex; align-items: center; gap: 0.4rem; color: #fff; }
  .meta-item.muted { color: rgba(255,255,255,0.6); }
  .meta-item .lbl { font-weight: 500; }
  .meta svg { flex: 0 0 auto; }
  .star { fill: #fff; }

  .title {
    font-size: 1.875rem; line-height: 1.1;
    font-weight: 400;
    letter-spacing: -0.04em;
    margin-bottom: 1rem;
    text-wrap: balance;
  }
  @media (min-width: 640px) { .title { font-size: 3rem; } }
  @media (min-width: 768px) { .title { font-size: 3.75rem; margin-bottom: 1.5rem; } }
  @media (min-width: 1024px) { .title { font-size: 4.5rem; } }

  .desc {
    font-size: 1rem; color: #9ca3af;
    margin-bottom: 1.5rem; max-width: 42rem;
    text-wrap: pretty;
  }
  @media (min-width: 640px) { .desc { font-size: 1.125rem; } }
  @media (min-width: 768px) { .desc { font-size: 1.25rem; margin-bottom: 3rem; } }

  .cta-row { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; }
  .btn-watch {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: #fff; color: #000;
    border-radius: 9999px; border: none;
    font-weight: 500; font-size: 0.95rem;
    padding: 0.625rem 1.5rem;
    transition: background 0.3s;
  }
  .btn-watch:hover { background: #e5e7eb; }
  @media (min-width: 640px) { .btn-watch { padding: 0.75rem 2rem; } }
  .btn-learn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    border-radius: 9999px; color: #fff;
    font-weight: 500; font-size: 0.95rem;
    padding: 0.625rem 1.5rem;
  }
  @media (min-width: 640px) { .btn-learn { padding: 0.75rem 2rem; } }

  .hero-nav-arrows { display: flex; gap: 0.75rem; }
  @media (min-width: 768px) { .hero-nav-arrows { flex-direction: row; } }
  .btn-arrow {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9999px; color: #fff;
    padding: 0.625rem 1rem;
    transition: background 0.3s;
  }
  @media (min-width: 640px) { .btn-arrow { padding: 0.75rem 1.5rem; } }
  .btn-arrow .arr { display: flex; align-items: center; }

  .zoom { transition: transform 0.3s ease; }
  .btn-arrow:hover .zoom, .liquid-glass:hover .zoom { transform: scale(1.15); }

  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
</style>
</head>
