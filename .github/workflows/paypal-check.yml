name: PayPal 결제 확인 및 고객 프로비저닝

on:
  schedule:
    - cron: "0 */2 * * *"   # 2시간 간격
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-paypal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PayPal 결제 조회
        id: paypal
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_SANDBOX: ${{ secrets.PAYPAL_SANDBOX }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          python paypal/paypal_client.py > result.json 2>&1
          cat result.json

      - name: 완료 주문 → 고객 등록
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/register_customers.py result.json

      - name: 변경사항 커밋
        run: |
          git config user.name "auto-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "자동: 결제 확인 및 고객 등록"
          git push
